name: Validate Runbook Project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Confirm required folders exist
        run: |
          test -d docs
          test -d scripts
          test -d schema
          test -d assets
          test -d data
          test -d outputs

      - name: Confirm required documentation exists
        run: |
          test -f README.md
          test -f docs/runbook.md

      - name: Compile Python scripts
        run: python -m compileall scripts

      - name: Validate processed CSV schema
        run: python scripts/validate_csv_schema.py
